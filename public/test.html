<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>JS Test</title></head>
<body>
<button id="btn1" onclick="testFn()">Click Me</button>
<div id="output">NOT WORKING</div>
<script>
function testFn() { document.getElementById("output").textContent = "WORKING!"; }
document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("output").textContent = "DOMContentLoaded fired!";
});
</script>
<script src="/js/app.js?v=3"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  var el = document.getElementById("output2");
  if (el) el.textContent = "app.js loaded, DOMContentLoaded fired!";
});
</script>
<div id="output2">app.js NOT loaded</div>
</body></html>
